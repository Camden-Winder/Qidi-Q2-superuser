[gcode_macro LINE_PURGE]
gcode:
    G92 E0                                # Reset extruder
    G0 F25000                             # Set travel speed
    G90                                   # Absolute positioning
    G0 X110 Y0                            # Move to purge position
    G0 Z0.8                               # Move to purge Z height
    M83                                   # Relative extrusion mode
    G1 E0 F30                             # Move filament tip
    G1 X165 E70 F250                      # Purge line
    G1 E-0.8 F1800                        # Retract
    G0 X180 F20000                        # Rapid move to break string
    G92 E0                                # Reset extruder distance
    M82                                   # Absolute extrusion mode
    G0 Z1.6 F25000                        # Raise nozzle after purge
