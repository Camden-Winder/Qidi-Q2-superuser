# idle_fan_shutdown.cfg
# ----------------------------------------------------------------------
# Powers down all fans and heaters after 10 minutes of idle, UNLESS any
# temperature sensor is still reporting an unsafe value. Re-checks every
# 60 seconds while temps are unsafe, so the printer only goes quiet when
# it is genuinely safe to do so.
#
# Installed by the Qidi Q2 Superuser AIO (both install paths).
# ----------------------------------------------------------------------

[delayed_gcode _IDLE_SHUTDOWN]
gcode:
    {% set safe_extruder = 50.0 %}
    {% set safe_bed = 50.0 %}
    {% set safe_chamber = 40.0 %}

    {% set ext = printer.extruder.temperature|float %}
    {% set bed = printer.heater_bed.temperature|float %}
    {% set chamber = (printer["temperature_sensor chamber"].temperature if "temperature_sensor chamber" in printer else 0)|float %}

    {% set unsafe = ext >= safe_extruder or bed >= safe_bed or chamber >= safe_chamber %}

    {% if unsafe %}
        RESPOND TYPE=echo MSG="Idle timeout reached, temps unsafe. Re-checking in 60s."
        UPDATE_DELAYED_GCODE ID=_IDLE_SHUTDOWN DURATION=60
    {% else %}
        RESPOND TYPE=echo MSG="Idle timeout reached, temps safe. Powering down."
        # Disable heaters
        M140 S0     # Bed heater off
        M141 S0     # Chamber heater off
        M104 S0     # Hotend off

        #Disable Fans
        M106 P2 S0  # Aux fan off
        M206 P3 S0  # Chamber circulation fan off (exhuast fan)
        M107        # Part cooling fan off

        # Leave the Qidi box heater on, if you wish it to shut of then delete the `#`
        #DISABLE_BOX_HEATER

        # Turn of stepper motors
        # Controller_fan blocks (chamber_fan, board_fan, etc) spool down on their own once their associated heater/stepper triggers go cold - disable_motors below is what they're watching.
        disable_motors
    {% endif %}
