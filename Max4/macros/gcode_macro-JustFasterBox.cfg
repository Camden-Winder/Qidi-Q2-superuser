# =============================================================================
# Qidi Max 4 — Just Faster Box macro set
# Install path: with Qidi Box. At install time aio_menu_max4.sh sets enable_box=1
# in saved_variables.cfg so box branches are active at runtime.
#
# Installed by aio_menu_max4.sh → config/gcode_macro.cfg
# Do NOT edit this file manually on the printer — it will be overwritten
# on the next AIO run. Edit the source in Max4/macros/ in the repo instead.
#
# Naming convention:
#   MAX4_*   — internal optimized macros (renamed from TLTG OPTIMIZED_*)
#   TLTG_*   — user-facing helper commands (kept from TLTG; documented in FAQ)
#   _MAX4_*  — private helpers (not intended to be called directly)
#
# Adapted from thelegendtubaguy/Qidi-Max-4-Optimized
# =============================================================================

# -----------------------------------------------------------------------------
# Globals — tuning knobs used by the macros below.
# Replaces [gcode_macro _tltg_optimized_globals].
# References to printer["gcode_macro _tltg_optimized_globals"] are rewritten
# to printer["gcode_macro _km_globals_max4"] throughout.
# -----------------------------------------------------------------------------
[gcode_macro _km_globals_max4]
# Set True to attempt reuse of the loaded filament between back-to-back prints
# when a Qidi Box is present and the same spool was active at end-of-print.
variable_keep_loaded_between_prints: True
# Short settle delay after disabling XY steppers before homing (ms)
variable_homing_settle_short: 20
# Long settle delay after restoring homing state (ms)
variable_homing_settle_long: 50
# Randomize the Z-probe XY point slightly to reduce wear on a single spot
variable_z_home_randomize_enable: True
variable_z_home_randomize_radius: 6
# XY travel speed used when moving to the Z-home randomized point (mm/min)
variable_move_to_z_travel_speed_xy: 40000
gcode:

[delayed_gcode _km_max4_startup_banner]
initial_duration: 6
gcode:
  {action_respond_info("MAX4 AIO Optimized Macros — Just Faster Box installed — Qidi Box enabled")}

# -----------------------------------------------------------------------------
# Bed-mesh helpers
# Adapted from bed_mesh.cfg — OPTIMIZED_G29_ZSAFE → MAX4_G29_ZSAFE
# -----------------------------------------------------------------------------

[gcode_macro _MAX4_G29_HOME_Z_OR_FULL]
description: Homes Z only when XY is already homed; otherwise runs a full home.
gcode:
  {% set homed = printer.toolhead.homed_axes|lower %}
  {% if 'x' in homed and 'y' in homed %}
    _MAX4_HOME_Z_FROM_SAFE_POINT
  {% else %}
    G28
  {% endif %}

[gcode_macro MAX4_G29_ZSAFE]
description: Optimised G29 that skips redundant XY rehome when possible.
gcode:
  SET_STEPPER_ENABLE STEPPER=extruder enable=0
  BED_MESH_CLEAR
  _MAX4_G29_HOME_Z_OR_FULL
  BED_MESH_CALIBRATE PROFILE=kamp
  SAVE_VARIABLE VARIABLE=profile_name VALUE='"kamp"'
  G4 P500
  SAVE_CONFIG_QD

# -----------------------------------------------------------------------------
# Homing override
# Adapted from kinematics.cfg.
# Replaces [homing_override] in stock klipper-macros-qd/kinematics.cfg —
# the installer comments out the stock section with ## AIO_DISABLED:.
# -----------------------------------------------------------------------------

[gcode_macro _MAX4_MOVE_TO_Z_HOME_POINT]
description: Moves to a slightly randomised XY point before Z homing.
gcode:
  {% set km = printer["gcode_macro _km_globals"] %}
  {% set opt = printer["gcode_macro _km_globals_max4"] %}
  {% set center_x = (km.print_min[0] + km.print_max[0]) / 2 %}
  {% set center_y = (km.print_min[1] + km.print_max[1]) / 2 %}
  {% set radius = opt.z_home_randomize_radius|default(0)|int %}
  {% set min_x = km.print_min[0] %}
  {% set max_x = km.print_max[0] %}
  {% set min_y = km.print_min[1] %}
  {% set max_y = km.print_max[1] %}
  {% if opt.z_home_randomize_enable|default(1)|int and radius > 0 %}
    {% set target_x = [max_x, [min_x, center_x + (range(-radius, radius + 1)|random)]|max]|min %}
    {% set target_y = [max_y, [min_y, center_y + (range(-radius, radius + 1)|random)]|max]|min %}
  {% else %}
    {% set target_x = center_x %}
    {% set target_y = center_y %}
  {% endif %}
  G90
  G1 X{target_x} Y{target_y} F{opt.move_to_z_travel_speed_xy}

[gcode_macro _MAX4_PREP_XY_HOME]
description: Sets a safe kinematic position and staging move before X/Y homing.
gcode:
  {% set opt = printer["gcode_macro _km_globals_max4"] %}
  {% set settle_short = opt.homing_settle_short|int %}
  {% set set_z = params.SET_Z|default(0)|int %}
  {% set move_z = params.MOVE_Z|default(0)|int %}
  {% set move_x = params.MOVE_X|default(0)|int %}
  {% set move_y = params.MOVE_Y|default(0)|int %}
  {% if set_z %}
    SET_KINEMATIC_POSITION Z=280
  {% endif %}
  SET_KINEMATIC_POSITION X=150
  SET_KINEMATIC_POSITION Y=150
  SET_STEPPER_ENABLE STEPPER=stepper_x enable=0
  SET_STEPPER_ENABLE STEPPER=stepper_y enable=0
  G4 P{settle_short}
  {% if move_z or move_x or move_y %}
    G91
    {% if move_z %}
      G1 Z{move_z} F480
    {% endif %}
    {% if move_x %}
      G1 X{move_x} F3000
    {% endif %}
    {% if move_y %}
      G1 Y{move_y} F3000
    {% endif %}
    G90
    M400
  {% endif %}
  SET_STEPPER_ENABLE STEPPER=stepper_x enable=0
  SET_STEPPER_ENABLE STEPPER=stepper_y enable=0
  G4 P{settle_short}

[gcode_macro _MAX4_HOME_Y_AND_BACKOFF]
description: Homes Y and backs off from the endstop.
gcode:
  G28.6245197 Y
  M400
  G91
  G1 Y20 F24000
  G90
  M400

[gcode_macro _MAX4_HOME_X_AND_BACKOFF]
description: Homes X and backs off from the endstop.
gcode:
  G28.6245197 X
  M400
  G91
  G1 X-20 F24000
  G90
  M400

[gcode_macro _MAX4_RESTORE_XY_HOMING_STATE]
description: Restores XY steppers to normal run state after homing.
gcode:
  {% set opt = printer["gcode_macro _km_globals_max4"] %}
  {% set settle_short = opt.homing_settle_short|int %}
  {% set settle_long = opt.homing_settle_long|int %}
  SET_HOMING_STATE STEPPER=y VALUE=2
  G4 P{settle_short}
  SET_HOMING_STATE STEPPER=x VALUE=2
  G4 P{settle_short}
  SET_HOMING_MODE STEPPER=y VALUE=2
  G4 P{settle_short}
  SET_HOMING_MODE STEPPER=x VALUE=2
  G4 P{settle_long}

[gcode_macro _MAX4_HOME_Z_FROM_SAFE_POINT]
description: Requests optimised Z homing through the active homing override.
gcode:
  G28 Z

[gcode_macro _MAX4_HOME_Z_FROM_SAFE_POINT_RAW]
description: Moves to the Z homing point, homes Z, and lifts clear.
gcode:
  {% set default_accel = printer.configfile.settings.printer.max_accel|float %}
  SET_VELOCITY_LIMIT ACCEL=10000
  _MAX4_MOVE_TO_Z_HOME_POINT
  M400
  SET_VELOCITY_LIMIT ACCEL=500
  G28.6245197 Z
  G91
  G1 Z10 F480
  G90
  M400
  SET_VELOCITY_LIMIT ACCEL={default_accel}

# Replaces [homing_override] in klipper-macros-qd/kinematics.cfg.
[homing_override]
gcode:
  {% set opt = printer["gcode_macro _km_globals_max4"] %}
  {% set default_accel = printer.configfile.settings.printer.max_accel|float %}
  {% set settle_long = opt.homing_settle_long|int %}
  {% set homed = printer.toolhead.homed_axes|lower %}
  {% set status = params.STATUS|default("homing") %}
  {% set lazy = params.LAZY|default(('O' in params)|int)|int %}
  {% if params.AXES is defined %}
    {% set axes = 'XYZ'|select('in', params.AXES|upper|list)|join() %}
  {% else %}
    {% set axes = 'XYZ'|select('in', params)|join() %}
  {% endif %}
  {% if not axes %}
    {% set axes = 'XYZ' %}
  {% endif %}
  {% if lazy %}
    {% set axes = axes|reject('in', printer.toolhead.homed_axes|upper)|join() %}
  {% endif %}

  {% if axes %}
    SET_PRINT_SUB_STATUS SUB_STATUS={status}
    {% set has_x = 'X' in axes %}
    {% set has_y = 'Y' in axes %}
    {% set has_z = 'Z' in axes %}
    {% set xy_homed = 'x' in homed and 'y' in homed %}
    {% set full_home = has_x and has_y and has_z %}
    {% set xy_home = has_x and has_y and not has_z %}
    {% set x_only = has_x and not has_y and not has_z %}
    {% set y_only = has_y and not has_x and not has_z %}
    {% set z_only = has_z and not has_x and not has_y %}
    {% set z_needs_full = z_only and not xy_homed %}
    M400
    EXIT_ENFORCE_MODE STEPPER=x
    G4 P{settle_long}
    EXIT_ENFORCE_MODE STEPPER=y
    G4 P{settle_long}
    BED_MESH_CLEAR
    SET_VELOCITY_LIMIT ACCEL=500
    M220 S100
    SET_STEPPER_ENABLE STEPPER=extruder enable=0
    {% if full_home or z_needs_full %}
      _MAX4_PREP_XY_HOME SET_Z=1 MOVE_Z=5
      _MAX4_HOME_Y_AND_BACKOFF
      _MAX4_HOME_X_AND_BACKOFF
      _MAX4_RESTORE_XY_HOMING_STATE
      _MAX4_HOME_Z_FROM_SAFE_POINT_RAW
    {% endif %}
    {% if xy_home %}
      _MAX4_PREP_XY_HOME
      _MAX4_HOME_Y_AND_BACKOFF
      _MAX4_HOME_X_AND_BACKOFF
      _MAX4_RESTORE_XY_HOMING_STATE
    {% endif %}
    {% if y_only %}
      _MAX4_PREP_XY_HOME
      _MAX4_HOME_Y_AND_BACKOFF
      _MAX4_RESTORE_XY_HOMING_STATE
    {% endif %}
    {% if x_only %}
      _MAX4_PREP_XY_HOME
      _MAX4_HOME_X_AND_BACKOFF
      _MAX4_RESTORE_XY_HOMING_STATE
    {% endif %}
    {% if z_only and xy_homed %}
      _MAX4_HOME_Z_FROM_SAFE_POINT_RAW
    {% endif %}
    {% if not (full_home or z_needs_full or xy_home or x_only or y_only or z_only) %}
      {action_raise_error("Unsupported homing axis combination. Supported: full home, XY, or single-axis X/Y/Z.")}
    {% endif %}
    SET_VELOCITY_LIMIT ACCEL={default_accel}
  {% endif %}

# -----------------------------------------------------------------------------
# Z offset
# Adapted from offset.cfg.
# Replaces [gcode_macro _km_apply_print_offset] in stock start_end.cfg —
# the installer comments out the stock definition with ## AIO_DISABLED:.
# -----------------------------------------------------------------------------

[gcode_macro _km_apply_print_offset]
description: Applies, captures, or saves the print Z offset from saved_variables.
variable_captured_z_offset: 0.0
variable_captured_z_offset_valid: 0
gcode:
  {% if params.RESET|default(0)|int %}
    {% set z = printer.save_variables.variables.z_offset|default(0)|float %}
    SET_GCODE_VARIABLE MACRO=_km_apply_print_offset VARIABLE=captured_z_offset VALUE={z}
    SET_GCODE_VARIABLE MACRO=_km_apply_print_offset VARIABLE=captured_z_offset_valid VALUE=1
    SET_GCODE_OFFSET Z=0 MOVE=0
  {% elif params.SET|default(0)|int %}
    {% if captured_z_offset_valid|int %}
      {% set z = captured_z_offset|float %}
    {% else %}
      {% set z = printer.save_variables.variables.z_offset|default(0)|float %}
    {% endif %}
    {action_respond_info("Your Z Offset will be set to: %.3f" % z)}
    SET_GCODE_OFFSET Z={z} MOVE=0
  {% elif params.SAVE|default(0)|int %}
    {% if printer.gcode_move.homing_origin.z < 0.5 %}
      SAVE_VARIABLE VARIABLE=z_offset VALUE={printer.gcode_move.homing_origin.z}
    {% endif %}
  {% endif %}

# -----------------------------------------------------------------------------
# Motion helpers
# Adapted from motion.cfg — OPTIMIZED_MOVE_TO_TRASH → MAX4_MOVE_TO_TRASH
# -----------------------------------------------------------------------------

[gcode_macro MAX4_MOVE_TO_TRASH]
description: Moves the toolhead to the purge chute / trash position safely.
gcode:
  {% set km = printer["gcode_macro _km_globals"] %}
  {% set saved_accel = printer.toolhead.max_accel|float %}
  SAVE_GCODE_STATE NAME=max4_move_to_trash_state
  G90
  G28 O X Y
  M204 S10000
  {% if (printer.gcode_move.position.y) > km.print_max[1] %}
    {% if (printer.gcode_move.position.x) > 150 or (printer.gcode_move.position.x) < 120 %}
      G1 Y{km.park_y - 30} F{km.travel_speed_xy}
      G1 X116 F{km.travel_speed_xy}
      G1 Y383 F{km.travel_speed_xy}
      G1 Y{km.park_y} F3500
      G1 X{km.park_x} F3500
    {% endif %}
    G1 X{km.park_x} Y{km.park_y} F{km.travel_speed_xy}
  {% else %}
    G1 Y{km.park_y - 30} F{km.travel_speed_xy}
    G1 X116 F{km.travel_speed_xy}
    G1 Y383 F{km.travel_speed_xy}
    G1 Y{km.park_y} F3500
    G1 X{km.park_x} F3500
  {% endif %}
  SET_VELOCITY_LIMIT ACCEL={saved_accel}
  RESTORE_GCODE_STATE NAME=max4_move_to_trash_state

# -----------------------------------------------------------------------------
# Heater wait helpers
# Adapted from heaters.cfg — OPTIMIZED_WAIT_* → MAX4_WAIT_*
# -----------------------------------------------------------------------------

[gcode_macro MAX4_WAIT_HOTEND]
description: Waits for the active hotend while preserving an optimised sub-status.
gcode:
  {% set extruder = "extruder" ~ params.T|replace('0', '') if "T" in params else printer.toolhead.extruder %}
  {% set status = params.STATUS|default("extruder_heating") %}
  SET_PRINT_SUB_STATUS SUB_STATUS={status}
  _GCODE_WAIT_WRAPPER HEATER={extruder}{% for k in params if k != "STATUS" %}{' ' ~ k ~ '="' ~ params[k] ~ '"'}{% endfor %}

[gcode_macro MAX4_WAIT_BED]
description: Waits for the bed while preserving an optimised sub-status.
gcode:
  {% set status = params.STATUS|default("bed_heating") %}
  SET_PRINT_SUB_STATUS SUB_STATUS={status}
  _GCODE_WAIT_WRAPPER HEATER=heater_bed {% for k in params if k != "STATUS" %}{' ' ~ k ~ '="' ~ params[k] ~ '"'}{% endfor %}

[gcode_macro MAX4_WAIT_CHAMBER]
description: Waits for the chamber while preserving an optimised sub-status.
gcode:
  {% if printer["heater_generic chamber"] is defined %}
    {% if "R" in params %}
      {% set dummy = params.__setitem__("S", params.R) %}
    {% endif %}
    {% set target = params.S|default(0)|float %}
    {% set status = params.STATUS|default("chamber_heating") %}
    {% if target > 0.0 %}
      SET_PRINT_SUB_STATUS SUB_STATUS={status}
      {% if printer["fan_generic chamber_circulation_fan"] is defined %}
        SET_FAN_SPEED FAN=chamber_circulation_fan SPEED=0
      {% endif %}
      SET_HEATER_TEMPERATURE_SCALED HEATER=chamber TARGET={target}
      TEMPERATURE_WAIT SENSOR="heater_generic chamber" MINIMUM={([target - 3, 0]|max)}
    {% endif %}
  {% endif %}

# -----------------------------------------------------------------------------
# Cooling helpers
# Adapted from cooling.cfg — OPTIMIZED_* → MAX4_*, TLTG_SET_BOX_TEMP kept
# -----------------------------------------------------------------------------

[gcode_macro MAX4_M1004]
description: Activates the polar cooler per the saved enable_polar_cooler variable.
gcode:
  {% set polar_cooler = printer.save_variables.variables.enable_polar_cooler|default(0) %}
  M106 P4 S{polar_cooler}

[gcode_macro MAX4_DISABLE_BOX_HEATER]
description: Disables the QIDI Box heater when the box stack is available.
gcode:
  {% if printer["box_extras"] is defined %}
    DISABLE_BOX_HEATER
  {% endif %}

# User-facing command — kept with TLTG_ prefix as documented in the FAQ.
# Usage: TLTG_SET_BOX_TEMP BOX=1 TARGET=45
[gcode_macro TLTG_SET_BOX_TEMP]
description: Sets a QIDI Box heater target by box number (1-based). TARGET=0 turns it off.
gcode:
  {% if params.BOX is not defined or params.TARGET is not defined %}
    {action_raise_error("Usage: TLTG_SET_BOX_TEMP BOX=<number> TARGET=<0..max>")}
  {% endif %}
  {% set box = params.BOX|int %}
  {% set target = params.TARGET|float %}
  {% set heater = "heater_box" ~ box %}
  {% set heater_object = "heater_generic " ~ heater %}
  {% set config_section = "box_config box" ~ (box - 1) %}
  {% set box_settings = printer.configfile.settings[config_section]|default({}) %}
  {% set target_max = box_settings.target_max_temp_heater_generic|default(90)|float %}
  {% if box < 1 %}
    {action_raise_error("BOX must be 1 or greater")}
  {% endif %}
  {% if heater_object not in printer.heaters.available_heaters %}
    {action_raise_error("QIDI Box heater not available: " ~ heater)}
  {% endif %}
  {% if target < 0 or target > target_max %}
    {action_raise_error("TARGET must be between 0 and " ~ target_max|string)}
  {% endif %}
  SET_HEATER_TEMPERATURE HEATER={heater} TARGET={target}

[gcode_macro MAX4_END_FAN_COOLDOWN]
description: Runs the chamber exhaust fan (P3) post-print, then stops it after T seconds.
variable_speed: 0
gcode:
  {% set speed = params.S|default(120)|int %}
  {% set duration = params.T|default(180)|int %}
  {% set speed = [0, [speed, 255]|min]|max %}
  {% set duration = [0, duration]|max %}
  UPDATE_DELAYED_GCODE ID=_max4_end_fan_cooldown_off DURATION=0
  {% if speed > 0 and duration > 0 %}
    M106 P3 S{speed}
    SET_GCODE_VARIABLE MACRO=MAX4_END_FAN_COOLDOWN VARIABLE=speed VALUE={speed}
    UPDATE_DELAYED_GCODE ID=_max4_end_fan_cooldown_off DURATION={duration}
  {% else %}
    M106 P3 S0
    SET_GCODE_VARIABLE MACRO=MAX4_END_FAN_COOLDOWN VARIABLE=speed VALUE=0
  {% endif %}

[delayed_gcode _max4_end_fan_cooldown_off]
gcode:
  {% set print_active = printer.idle_timeout.state|string == "Printing" or (printer.virtual_sdcard|default({})).is_active|default(False) or printer.pause_resume.is_paused|default(False) %}
  {% if not print_active %}
    M106 P3 S0
  {% endif %}
  SET_GCODE_VARIABLE MACRO=MAX4_END_FAN_COOLDOWN VARIABLE=speed VALUE=0

# -----------------------------------------------------------------------------
# Cancel / error handler
# Adapted from cancel.cfg — OPTIMIZED_CANCEL_PRINT_ON_ERROR → MAX4_CANCEL_PRINT_ON_ERROR
# printer.cfg on_error_gcode is patched to call this name at install time.
# -----------------------------------------------------------------------------

[gcode_macro MAX4_CANCEL_PRINT_ON_ERROR]
description: Cancels a failed virtual-sd print without parking or moving the toolhead.
gcode:
  {action_respond_info("Print error: cancelling without parking the toolhead.")}
  SET_GCODE_VARIABLE MACRO=_print_end_inner VARIABLE=cancelled VALUE="{True}"
  M104 S0
  M140 S0
  M141 S0
  MAX4_DISABLE_BOX_HEATER
  M107
  M106 P2 S0
  M106 P3 S0
  M106 P4 S0
  {% if printer.pause_resume.is_paused %}
    RESTORE_GCODE_STATE NAME=_KM_PAUSE_OVERRIDE_STATE MOVE=0
  {% endif %}
  G31
  CLEAR_PAUSE
  _KM_CANCEL_PRINT_BASE

# -----------------------------------------------------------------------------
# Filament helpers
# Adapted from filament.cfg.
# JFP path: OPTIMIZED_WIPE_AND_SCRAPE_NOZZLE is the primary filament prep.
# OPTIMIZED_START_PRINT_FILAMENT_PREP includes all three branches (reuse,
# box_enabled, else/no-box) — JFP always lands in the else branch at runtime
# because box_extras will not be defined without a Qidi Box.
# -----------------------------------------------------------------------------

[gcode_macro MAX4_CUT_FILAMENT]
description: Faster filament cutter without the stock exit dwell.
gcode:
  {% set saved_accel = printer.toolhead.max_accel|float %}
  SAVE_GCODE_STATE NAME=max4_cut_filament_state
  G90
  _CG28
  M204 S10000
  {% if (printer.gcode_move.position.x) < 15 %}
    G1 X15 F9000
    G1 Y0 F9000
  {% endif %}
  M400
  G1 Y0 F15000
  G1 X15 F15000
  G1 X3 F8000
  M83
  G1 E-4 F1000
  G1 X4 F1000
  G1 X3 F8000
  G1 X15 F8000
  SET_VELOCITY_LIMIT ACCEL={saved_accel}
  RESTORE_GCODE_STATE NAME=max4_cut_filament_state

[gcode_macro MAX4_UNLOAD_FILAMENT]
description: Box unload wrapper that also clears retained-tool state.
gcode:
  {% set box_available = printer["box_extras"] is defined %}
  {% set box_enabled = printer.save_variables.variables.enable_box|default(0)|int == 1 and box_available %}
  SAVE_VARIABLE VARIABLE=retained_tool VALUE=-1
  SAVE_VARIABLE VARIABLE=retained_tool_ready VALUE=0
  SAVE_VARIABLE VARIABLE=retained_slot VALUE='"slot-1"'
  SAVE_VARIABLE VARIABLE=retained_filament_id VALUE=-1
  SAVE_VARIABLE VARIABLE=retained_vendor_id VALUE=-1
  {% if box_enabled %}
    {% set T = params.T|int %}
    {% set cleanup = params.CLEANUP|default(1)|int %}
    {% set saved_accel = printer.toolhead.max_accel|float %}
    SAVE_GCODE_STATE NAME=max4_unload_filament_state
    G90
    M83
    CUT_FILAMENT T={T}
    MAX4_MOVE_TO_TRASH
    UNLOAD_T{T}
    G1 E25 F300
    {% if cleanup %}
      M104 S0
      CLEAR_OOZE
      CLEAR_FLUSH
    {% endif %}
    SET_VELOCITY_LIMIT ACCEL={saved_accel}
    RESTORE_GCODE_STATE NAME=max4_unload_filament_state
  {% endif %}

[gcode_macro MAX4_WIPE_AND_SCRAPE_NOZZLE]
description: Softens nozzle ooze, wipes at the chute, and scrapes at the rear bed without purging.
gcode:
  {% set km = printer["gcode_macro _km_globals"] %}
  {% set scrape_target = params.TARGET|default(km.start_extruder_probing_temp if km.start_extruder_probing_temp > 0 else 140)|int %}
  {% set scrape_maximum = scrape_target + 10 %}
  {% set box_available = printer["box_extras"] is defined %}
  SET_PRINT_SUB_STATUS SUB_STATUS=clear_nozzle
  M104 S{scrape_target}
  MAX4_MOVE_TO_TRASH
  MAX4_WAIT_HOTEND S={scrape_target} STATUS=clear_nozzle
  TEMPERATURE_WAIT SENSOR={printer.toolhead.extruder} MAXIMUM={scrape_maximum}
  M106 S255
  {% if box_available %}
    CLEAR_OOZE
    CLEAR_FLUSH
  {% endif %}
  MAX4_MOVE_TO_TRASH
  G1 Y395 F6000
  G1 X188
  G1 Z-0.2 F480
  G91
  G1 X15 F200
  G1 Y2
  G1 X-15
  G1 Y-2
  G1 X15
  G90
  G2 I0.5 J0.5 F480
  G2 I0.5 J0.5
  G2 I0.5 J0.5
  G1 Z10
  G1 Y383 F12000
  M106 S0
  M106 P2 S0

[gcode_macro MAX4_START_PRINT_FILAMENT_PREP]
description: Handles print-start filament prep and optional same-tool reuse (box path).
gcode:
  {% set tool = params.EXTRUDER|int %}
  {% if params.FIRSTLAYERTEMP is not defined or params.PURGETEMP is not defined %}
    {action_raise_error("MAX4_START_PRINT_FILAMENT_PREP requires FIRSTLAYERTEMP and PURGETEMP")}
  {% endif %}
  {% set first_layer_temp = params.FIRSTLAYERTEMP|int %}
  {% set purge_temp = params.PURGETEMP|int %}
  {% set bed_target = params.BEDTEMP|int %}
  {% set chamber_target = params.CHAMBER|default(0)|int %}
  {% set km = printer["gcode_macro _km_globals"] %}
  {% set opt = printer["gcode_macro _km_globals_max4"] %}
  {% set svv = printer.save_variables.variables %}
  {% set box_available = printer["box_extras"] is defined %}
  {% set box_enabled = svv.enable_box|default(0)|int == 1 and box_available %}
  {% set retained_tool_ready = svv.retained_tool_ready|default(0)|int %}
  {% set retained_slot = svv.retained_slot|default('slot-1') %}
  {% set retained_filament_id = svv.retained_filament_id|default(-1)|int %}
  {% set retained_vendor_id = svv.retained_vendor_id|default(-1)|int %}
  {% set filament_present = printer['filament_switch_sensor filament_switch_sensor'].filament_detected %}
  {% set tool_slot = svv['value_t' ~ tool]|default('slot' ~ tool) %}
  {% set current_filament_id = svv['filament_' ~ tool_slot]|default(-1)|int %}
  {% set current_vendor_id = svv['vendor_' ~ tool_slot]|default(-1)|int %}
  {% set slot_sync = svv.slot_sync|default('slot-1') %}
  {% set reuse_loaded = opt.keep_loaded_between_prints|int and box_enabled and retained_tool_ready and filament_present and retained_slot == tool_slot and slot_sync == retained_slot and current_filament_id == retained_filament_id and current_vendor_id == retained_vendor_id %}
  {% set reuse_nozzle_target = km.start_extruder_probing_temp if km.start_extruder_probing_temp > 0 else ((km.start_extruder_preheat_scale * purge_temp)|round(0, 'ceil')|int) %}
  {% set scrape_target = km.start_extruder_probing_temp if km.start_extruder_probing_temp > 0 else 140 %}
  {% set scrape_maximum = scrape_target + 10 %}

  G31
  SAVE_VARIABLE VARIABLE=retained_tool_ready VALUE=0

  {% if reuse_loaded %}
    # Box + same spool still loaded — skip purge, just clean and mesh.
    SAVE_VARIABLE VARIABLE=retained_tool VALUE={tool}
    SAVE_VARIABLE VARIABLE=retained_slot VALUE='"{retained_slot}"'
    SAVE_VARIABLE VARIABLE=retained_filament_id VALUE={retained_filament_id}
    SAVE_VARIABLE VARIABLE=retained_vendor_id VALUE={retained_vendor_id}
    M118 Reusing retained filament on T{tool}
    M104 S{reuse_nozzle_target}
    {% if bed_target > 0 %}
      M140 S{bed_target}
    {% endif %}
    {% if chamber_target > 0 %}
      M141 S{chamber_target}
    {% endif %}
    G1 Z20 F480
    MAX4_MOVE_TO_TRASH
    {% if bed_target > 0 %}
      MAX4_WAIT_BED S={bed_target} STATUS=wait_bed_temp
    {% endif %}
    {% if chamber_target > 0 %}
      MAX4_WAIT_CHAMBER S={chamber_target} STATUS=wait_chamber_temp
    {% endif %}
    MAX4_WAIT_HOTEND S={reuse_nozzle_target} STATUS=clear_nozzle
    M83
    G92 E0
    G1 E-0.2 F1800
    M106 S255
    CLEAR_OOZE
    CLEAR_FLUSH
    M106 S0
    SET_PRINT_SUB_STATUS SUB_STATUS=z_tilt_adjust
    Z_TILT_ADJUST
    M400
    SET_PRINT_SUB_STATUS SUB_STATUS=auto_bed_adjust
    SET_STEPPER_ENABLE STEPPER=extruder enable=0
    BED_MESH_CLEAR
    _MAX4_G29_HOME_Z_OR_FULL
    BED_MESH_CALIBRATE PROFILE=kamp
    SAVE_VARIABLE VARIABLE=profile_name VALUE='"kamp"'
    G4 P500
    SAVE_CONFIG_QD
    M1002 A1
    G1 X380 Y5 F20000
    ENABLE_ALL_SENSOR
  {% elif box_enabled %}
    # Box present — standard box filament load + purge sequence.
    SAVE_VARIABLE VARIABLE=retained_tool VALUE=-1
    SAVE_VARIABLE VARIABLE=retained_slot VALUE='"slot-1"'
    SAVE_VARIABLE VARIABLE=retained_filament_id VALUE=-1
    SAVE_VARIABLE VARIABLE=retained_vendor_id VALUE=-1
    SET_PRINT_SUB_STATUS SUB_STATUS=change_filament
    BOX_PRINT_START EXTRUDER={tool} HOTENDTEMP={purge_temp}
    M400
    MAX4_EXTRUSION_AND_FLUSH PURGETEMP={purge_temp} CHAMBER={chamber_target}
    SET_PRINT_SUB_STATUS SUB_STATUS=clear_nozzle
    G1 Z20 F480
    MAX4_MOVE_TO_TRASH
    G1 E-0.2 F1800
    M104 S{scrape_target}
    {% if purge_temp > scrape_target %}
      TEMPERATURE_WAIT SENSOR=extruder MAXIMUM={purge_temp}
    {% endif %}
    CLEAR_OOZE
    CLEAR_FLUSH
    {% if purge_temp - 30 > scrape_target %}
      TEMPERATURE_WAIT SENSOR=extruder MAXIMUM={purge_temp - 30}
      CLEAR_OOZE
      CLEAR_FLUSH
    {% endif %}
    TEMPERATURE_WAIT SENSOR=extruder MAXIMUM={scrape_maximum}
    CLEAR_OOZE
    CLEAR_FLUSH
    MAX4_MOVE_TO_TRASH
    G1 Y395 F6000
    G1 X188
    G1 Z-0.2 F480
    G91
    G1 X15 F200
    G1 Y2
    G1 X-15
    G1 Y-2
    G1 X15
    G90
    G2 I0.5 J0.5 F480
    G2 I0.5 J0.5
    G2 I0.5 J0.5
    G1 Z10
    G1 Y383 F12000
    M106 S0
    M106 P2 S0
    {% if bed_target > 0 %}
      MAX4_WAIT_BED S={bed_target} STATUS=wait_bed_temp
    {% endif %}
    {% if chamber_target > 0 %}
      MAX4_WAIT_CHAMBER S={chamber_target} STATUS=wait_chamber_temp
    {% endif %}
    G1 X15 Y202.5 F36000
    SET_PRINT_SUB_STATUS SUB_STATUS=z_tilt_adjust
    Z_TILT_ADJUST
    M400
    SET_PRINT_SUB_STATUS SUB_STATUS=auto_bed_adjust
    SET_STEPPER_ENABLE STEPPER=extruder enable=0
    BED_MESH_CLEAR
    _MAX4_G29_HOME_Z_OR_FULL
    BED_MESH_CALIBRATE PROFILE=kamp
    SAVE_VARIABLE VARIABLE=profile_name VALUE='"kamp"'
    G4 P500
    SAVE_CONFIG_QD
    M1002 A1
    G1 X380 Y5 F20000
    ENABLE_ALL_SENSOR
  {% else %}
    # No box — wipe and scrape nozzle, then wait for temps and mesh.
    SAVE_VARIABLE VARIABLE=retained_tool VALUE=-1
    SAVE_VARIABLE VARIABLE=retained_slot VALUE='"slot-1"'
    SAVE_VARIABLE VARIABLE=retained_filament_id VALUE=-1
    SAVE_VARIABLE VARIABLE=retained_vendor_id VALUE=-1
    M118 Starting without QIDI Box filament prep
    {% if bed_target > 0 %}
      M140 S{bed_target}
    {% endif %}
    {% if chamber_target > 0 %}
      M141 S{chamber_target}
    {% endif %}
    MAX4_WIPE_AND_SCRAPE_NOZZLE TARGET={scrape_target}
    {% if chamber_target == 0 %}
      M106 P3 S255
    {% else %}
      M106 P3 S0
    {% endif %}
    {% if bed_target > 0 %}
      MAX4_WAIT_BED S={bed_target} STATUS=wait_bed_temp
    {% endif %}
    {% if chamber_target > 0 %}
      MAX4_WAIT_CHAMBER S={chamber_target} STATUS=wait_chamber_temp
    {% endif %}
    SET_PRINT_SUB_STATUS SUB_STATUS=z_tilt_adjust
    Z_TILT_ADJUST
    M400
    SET_PRINT_SUB_STATUS SUB_STATUS=auto_bed_adjust
    SET_STEPPER_ENABLE STEPPER=extruder enable=0
    BED_MESH_CLEAR
    _MAX4_G29_HOME_Z_OR_FULL
    BED_MESH_CALIBRATE PROFILE=kamp
    SAVE_VARIABLE VARIABLE=profile_name VALUE='"kamp"'
    G4 P500
    SAVE_CONFIG_QD
    M1002 A1
    G1 X380 Y5 F20000
    ENABLE_ALL_SENSOR
  {% endif %}

[gcode_macro MAX4_END_PRINT_FILAMENT_PREP]
description: Optionally retains the current box filament loaded between prints.
variable_retained: 0
gcode:
  {% set tool = params.T|default(-1)|int %}
  {% set opt = printer["gcode_macro _km_globals_max4"] %}
  {% set svv = printer.save_variables.variables %}
  {% set box_available = printer["box_extras"] is defined %}
  {% set box_enabled = svv.enable_box|default(0)|int == 1 and box_available %}
  {% set filament_present = printer['filament_switch_sensor filament_switch_sensor'].filament_detected %}
  {% set tool_slot = svv['value_t' ~ tool]|default('slot' ~ tool) %}
  {% set slot_sync = svv.slot_sync|default('slot-1') %}
  {% set active_slot = slot_sync if slot_sync != 'slot-1' else tool_slot %}
  {% set active_tool = namespace(value=tool) %}
  {% for candidate in range(16) %}
    {% if svv['value_t' ~ candidate]|default('slot' ~ candidate) == active_slot %}
      {% set active_tool.value = candidate %}
    {% endif %}
  {% endfor %}
  {% set active_filament_id = svv['filament_' ~ active_slot]|default(-1)|int %}
  {% set active_vendor_id = svv['vendor_' ~ active_slot]|default(-1)|int %}
  {% set keep_loaded = opt.keep_loaded_between_prints|int and box_enabled and tool >= 0 and active_slot != 'slot-1' and filament_present %}

  {% if keep_loaded %}
    SET_GCODE_VARIABLE MACRO=MAX4_END_PRINT_FILAMENT_PREP VARIABLE=retained VALUE=1
    SAVE_VARIABLE VARIABLE=retained_tool VALUE={active_tool.value}
    SAVE_VARIABLE VARIABLE=retained_tool_ready VALUE=1
    SAVE_VARIABLE VARIABLE=retained_slot VALUE='"{active_slot}"'
    SAVE_VARIABLE VARIABLE=retained_filament_id VALUE={active_filament_id}
    SAVE_VARIABLE VARIABLE=retained_vendor_id VALUE={active_vendor_id}
    M118 Retaining filament on T{active_tool.value} for next print
  {% else %}
    SET_GCODE_VARIABLE MACRO=MAX4_END_PRINT_FILAMENT_PREP VARIABLE=retained VALUE=0
    SAVE_VARIABLE VARIABLE=retained_tool VALUE=-1
    SAVE_VARIABLE VARIABLE=retained_tool_ready VALUE=0
    SAVE_VARIABLE VARIABLE=retained_slot VALUE='"slot-1"'
    SAVE_VARIABLE VARIABLE=retained_filament_id VALUE=-1
    SAVE_VARIABLE VARIABLE=retained_vendor_id VALUE=-1
    SAVE_GCODE_STATE NAME=max4_end_print_filament_prep_state
    M83
    G1 E-3 F1800
    RESTORE_GCODE_STATE NAME=max4_end_print_filament_prep_state
    MAX4_UNLOAD_FILAMENT T={tool} CLEANUP=0
  {% endif %}

[gcode_macro MAX4_END_NOZZLE_COOLDOWN_START]
description: Captures the hotend target and starts shutdown cooldown from the purge chute.
gcode:
  M106 S255
  {% set extruder = printer.toolhead.extruder %}
  {% set hotend = printer[extruder] %}
  {% set hotend_target = hotend.target|float %}
  {% set fallback_start_temp = hotend_target if hotend_target > 0 else hotend.temperature|float %}
  {% set start_temp = params.START_TEMP|default(fallback_start_temp)|float %}
  {% set exhaust_speed = params.EXHAUST_SPEED|default(0)|int %}
  {% set exhaust_duration = params.EXHAUST_DURATION|default(180)|int %}
  SET_GCODE_VARIABLE MACRO=MAX4_END_STAGED_NOZZLE_WIPE VARIABLE=start_temp VALUE={start_temp}
  MAX4_DISABLE_BOX_HEATER
  M141 S0
  M140 S0
  M104 S0
  DISABLE_ALL_SENSOR
  {% if exhaust_speed > 0 %}
    MAX4_END_FAN_COOLDOWN S={exhaust_speed} T={exhaust_duration}
  {% else %}
    MAX4_END_FAN_COOLDOWN S=0 T=0
  {% endif %}

[gcode_macro MAX4_END_STAGED_NOZZLE_WIPE]
description: Waits for staged hotend cooldown and wipes the purge-chute nozzle wiper twice.
variable_start_temp: 0
gcode:
  {% set extruder = printer.toolhead.extruder %}
  {% set stored_start_temp = printer["gcode_macro MAX4_END_STAGED_NOZZLE_WIPE"].start_temp|default(0)|float %}
  {% set start_temp = params.START_TEMP|default(stored_start_temp)|float %}
  {% set first_wipe_temp = [0, start_temp - 40]|max %}
  {% set final_wipe_temp = params.FINAL_TEMP|default(140)|float %}
  {% set pull_forward_y = params.PULL_FORWARD_Y|default(30)|float %}
  {% set box_available = printer["box_extras"] is defined %}
  SET_PRINT_SUB_STATUS SUB_STATUS=clear_nozzle
  {% if first_wipe_temp > 0 %}
    TEMPERATURE_WAIT SENSOR={extruder} MAXIMUM={first_wipe_temp}
  {% endif %}
  {% if box_available %}
    CLEAR_OOZE
    CLEAR_FLUSH
  {% endif %}
  TEMPERATURE_WAIT SENSOR={extruder} MAXIMUM={final_wipe_temp}
  {% if box_available %}
    CLEAR_OOZE
    CLEAR_FLUSH
  {% endif %}
  SAVE_GCODE_STATE NAME=max4_end_staged_nozzle_wipe_state
  G91
  G1 Y-{pull_forward_y} F6000
  RESTORE_GCODE_STATE NAME=max4_end_staged_nozzle_wipe_state

[gcode_macro MAX4_END_NOZZLE_CLEANUP]
description: Backward-compatible alias for the staged cooldown wipe sequence.
gcode:
  MAX4_MOVE_TO_TRASH
  MAX4_END_NOZZLE_COOLDOWN_START {rawparams}
  MAX4_END_STAGED_NOZZLE_WIPE

[gcode_macro MAX4_EXTRUSION_AND_FLUSH]
description: Box purge sequence — extrudes and flushes at purge temperature.
gcode:
  {% set purge_temp = params.PURGETEMP|int %}
  {% set chamber = params.CHAMBER|default(0)|int %}
  {% set box_available = printer["box_extras"] is defined %}
  {% set box_enabled = printer.save_variables.variables.box_count|default(0)|int > 0 and printer.save_variables.variables.enable_box|default(0)|int == 1 and box_available %}
  {% if box_enabled %}
    SET_PRINT_SUB_STATUS SUB_STATUS=flush_filament
    MAX4_MOVE_TO_TRASH
    MAX4_WAIT_HOTEND S={purge_temp} STATUS=flush_filament
    M83
    M106 S0
    M106 P2 S0
    G1 E10 F300
    G1 E-2 F1800
    M106 S127
    M106 P2 S127
    {% for i in range(1,3) %}
      M400
      G1 E60 F300
      G1 E-2 F1800
    {% endfor %}
    M400
    M106 S255
    M106 P2 S255
    {% if chamber == 0 %}
      M106 P3 S255
    {% else %}
      M106 P3 S0
    {% endif %}
    MAX4_M1004
    G4 P5000
    CLEAR_OOZE
    CLEAR_FLUSH
  {% endif %}

  {% if printer['filament_switch_sensor filament_switch_sensor'].filament_detected == False %}
    M118 Filament run out
    PAUSE
    {% if box_enabled %}
      SET_PRINT_SUB_STATUS SUB_STATUS=box_filament_exhausted
    {% else %}
      SET_PRINT_SUB_STATUS SUB_STATUS=ext_filament_exhausted
    {% endif %}
  {% endif %}

