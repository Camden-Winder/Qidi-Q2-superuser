name: Bug Report
description: Create a report to help us improve
title: "[Bug]: "
labels: ["bug"]
assignees: []
body:
  - type: input
    id: aoi-version
    attributes:
      label: AOI Version (RC #)
      description: Which release candidate are you running?
      placeholder: "e.g., RC 2.40"
    validations:
      required: true

  - type: dropdown
    id: install_path
    attributes:
      label: Install Type
      description: Which install option did you pick?
      options:
        - Bunny Box & Helixscreen
        - Just Faster Printer
        - Just Faster Box
    validations:
      required: true

  - type: input
    id: firmware
    attributes:
      label: Printer Firmware
      description: What firmware version is your printer on?
      placeholder: "e.g., 1.1.1 or 01.01.02+"
    validations:
      required: true

  - type: textarea
    id: description
    attributes:
      label: Describe the Bug
      description: A clear and concise description of what the bug is.
      placeholder: Tell us what happened...
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps to Reproduce
      description: Steps to reproduce the behavior.
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected Behavior
      description: A clear and concise description of what you expected to happen.
    validations:
      required: true

  - type: textarea
    id: screenshots
    attributes:
      label: Screenshots
      description: If applicable, add screenshots to help explain your problem. You can paste images directly into this field.
    validations:
      required: false
