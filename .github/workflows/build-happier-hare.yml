name: Build Happier Hare HelixScreen

on:
  workflow_dispatch:
    inputs:
      helixscreen_pin:
        description: 'HelixScreen git tag to build against'
        required: false
        default: 'v0.99.70'

      release_tag:
        description: 'GitHub release tag to create'
        required: false
        default: 'happier-hare-rc2.12'

      build_jobs:
        description: 'Parallel compile jobs'
        required: false
        default: '2'

jobs:
  build:
    runs-on: self-hosted

    permissions:
      contents: write

    defaults:
      run:
        shell: powershell

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Full Windows Environment Diagnostics
        run: |
          Write-Host "=== COMPUTER INFO ==="
          hostname
          whoami

          Write-Host ""
          Write-Host "=== POWERSHELL VERSION ==="
          $PSVersionTable

          Write-Host ""
          Write-Host "=== PATH ==="
          $env:PATH

          Write-Host ""
          Write-Host "=== DOCKER COMMAND LOOKUP ==="
          Get-Command docker -ErrorAction SilentlyContinue

          Write-Host ""
          Write-Host "=== COMMON DOCKER PATHS ==="

          Test-Path "C:\Program Files\Docker\Docker\resources\bin\docker.exe"

          Test-Path "C:\Program Files\Docker\Docker\resources\bin"

          Test-Path "C:\Program Files\Docker\Desktop\Docker Desktop.exe"

          Test-Path "C:\Program Files\Docker"

          Write-Host ""
          Write-Host "=== DIRECTORY LISTING ==="

          if (Test-Path "C:\Program Files\Docker") {
            Get-ChildItem "C:\Program Files\Docker" -Recurse -ErrorAction SilentlyContinue | Select-Object FullName
          }

          Write-Host ""
          Write-Host "=== DOCKER VERSION DIRECT EXECUTION ==="

          if (Test-Path "C:\Program Files\Docker\Docker\resources\bin\docker.exe") {
            & "C:\Program Files\Docker\Docker\resources\bin\docker.exe" --version
          }

          Write-Host ""
          Write-Host "=== WSL STATUS ==="
          wsl --status

          Write-Host ""
          Write-Host "=== WSL DISTROS ==="
          wsl -l -v

          Write-Host ""
          Write-Host "=== GIT BASH CHECK ==="

          Get-Command bash -ErrorAction SilentlyContinue

          Write-Host ""
          Write-Host "=== GH CLI CHECK ==="

          Get-Command gh -ErrorAction SilentlyContinue

          Write-Host ""
          Write-Host "=== DOCKER CONTEXT ==="

          docker context ls

      - name: Set Docker Path
        run: |
          echo "C:\Program Files\Docker\Docker\resources\bin" >> $env:GITHUB_PATH

      - name: Verify Docker After PATH Injection
        run: |
          $env:PATH += ";C:\Program Files\Docker\Docker\resources\bin"

          Write-Host "=== UPDATED PATH ==="
          $env:PATH

          Write-Host ""
          Write-Host "=== DOCKER VERSION ==="

          docker --version

          Write-Host ""
          Write-Host "=== DOCKER INFO ==="

          docker info

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
